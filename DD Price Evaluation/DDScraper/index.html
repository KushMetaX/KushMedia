<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doginal Dogs — Price Evaluator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            doge: { gold: '#d4af37', amber: '#f5a623', dark: '#0d0d0d', card: '#161616', border: '#2a2a2a', muted: '#888' },
          },
          fontFamily: { mono: ['"JetBrains Mono"', 'monospace'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin .8s linear infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .35s ease-out both; }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 8px rgba(212,175,55,.25); } 50% { box-shadow: 0 0 20px rgba(212,175,55,.45); } }
    .glow-pulse { animation: pulse-glow 2s ease-in-out infinite; }
    input[type="text"]:focus { box-shadow: 0 0 0 2px rgba(212,175,55,.5); }
    .trait-chip { transition: background .15s; }
    .trait-chip:hover { background: #2a2a2a; }
  </style>
</head>
<body class="bg-doge-dark text-gray-200 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="pt-10 pb-4 text-center select-none">
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">
      <span class="text-doge-gold">Doginal Dogs</span> Price Evaluator
    </h1>
    <p class="mt-2 text-sm text-doge-muted">Trait-weighted valuation powered by live market data</p>
  </header>

  <!-- Main -->
  <main class="flex-1 w-full max-w-2xl mx-auto px-4 pb-16">

    <!-- Search -->
    <form id="searchForm" class="mt-6 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <div class="relative flex-1">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-doge-muted text-lg font-semibold select-none">#</span>
        <input
          id="dogInput"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Enter dog number (1–10000)"
          class="w-full pl-8 pr-4 py-3 rounded-lg bg-doge-card border border-doge-border text-white placeholder-gray-500 focus:outline-none text-base"
        />
      </div>
      <button
        type="submit"
        id="evalBtn"
        class="px-6 py-3 rounded-lg bg-doge-gold text-doge-dark font-semibold text-base hover:brightness-110 active:scale-[.97] transition-all disabled:opacity-40 disabled:pointer-events-none whitespace-nowrap"
      >
        Evaluate Price
      </button>
    </form>

    <!-- Status area -->
    <div id="status" class="mt-8 text-center"></div>

    <!-- Result card -->
    <div id="result" class="mt-6"></div>
  </main>

  <!-- Footer -->
  <footer class="py-6 text-center text-xs text-gray-600 border-t border-doge-border">
    Data sourced from <a href="https://market.doginaldogs.com" target="_blank" rel="noopener" class="text-doge-gold hover:underline">market.doginaldogs.com</a>
    &middot; Prices powered by a custom DDScraper evaluation engine
  </footer>

  <script>
    const API_BASE = window.location.origin;

    const form      = document.getElementById('searchForm');
    const input     = document.getElementById('dogInput');
    const evalBtn   = document.getElementById('evalBtn');
    const statusEl  = document.getElementById('status');
    const resultEl  = document.getElementById('result');

    /* ---------- helpers ---------- */

    function sanitizeNumber(raw) {
      return parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
    }

    function fmt(n, decimals = 0) {
      if (n == null) return '—';
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function fmtDoge(n) { return n != null ? `${fmt(n)} DOGE` : '—'; }
    function fmtUsd(n)  { return n != null ? `$${fmt(n, 2)}` : ''; }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function verdictColor(v) {
      if (v === 'undervalued') return 'text-green-400';
      if (v === 'overpriced')  return 'text-red-400';
      return 'text-yellow-400';
    }

    function verdictIcon(v) {
      if (v === 'undervalued') return '&#9650;';  // ▲
      if (v === 'overpriced')  return '&#9660;';  // ▼
      return '&#9644;';                            // ▬
    }

    /* ---------- loading / error ---------- */

    function showLoading() {
      evalBtn.disabled = true;
      statusEl.innerHTML = `
        <div class="flex items-center justify-center gap-3 text-doge-muted">
          <svg class="spinner w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" stroke-opacity=".25"/>
            <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
          </svg>
          <span>Evaluating&hellip;</span>
        </div>`;
      resultEl.innerHTML = '';
    }

    function showError(msg) {
      evalBtn.disabled = false;
      statusEl.innerHTML = `
        <div class="inline-flex items-center gap-2 bg-red-900/30 border border-red-800 text-red-300 px-4 py-2 rounded-lg text-sm fade-up">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M12 9v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
          ${escapeHtml(msg)}
        </div>`;
      resultEl.innerHTML = '';
    }

    function clearStatus() {
      evalBtn.disabled = false;
      statusEl.innerHTML = '';
    }

    /* ---------- render result ---------- */

    function renderResult(d) {
      clearStatus();

      const est = d.estimation || {};
      const la  = d.listingAnalysis;

      // Trait chips
      const traitHtml = (d.traitBreakdown || []).map(t => `
        <div class="trait-chip flex items-center justify-between gap-4 px-3 py-2 rounded-md bg-doge-dark border border-doge-border text-sm">
          <span class="text-gray-400 capitalize">${escapeHtml(t.trait)}</span>
          <span class="text-white font-medium">${escapeHtml(t.value)}</span>
          <span class="text-doge-muted text-xs ml-auto">${t.floor != null ? fmtDoge(t.floor) : '<span class=&quot;text-purple-400&quot;>unlisted</span>'}</span>
        </div>
      `).join('');

      resultEl.innerHTML = `
      <div class="fade-up bg-doge-card border border-doge-border rounded-2xl overflow-hidden">

        <!-- Top banner: image + summary -->
        <div class="flex flex-col sm:flex-row items-center gap-6 p-6 border-b border-doge-border">
          <img
            src="${escapeHtml(d.imageUrl)}"
            alt="${escapeHtml(d.name)}"
            class="w-28 h-28 rounded-xl border-2 border-doge-gold/40 object-cover bg-doge-dark glow-pulse"
            onerror="this.style.display='none'"
          />
          <div class="text-center sm:text-left flex-1 min-w-0">
            <h2 class="text-xl font-bold text-white truncate">${escapeHtml(d.name)}</h2>
            <p class="text-doge-muted text-sm mt-1 font-mono truncate">${d.inscriptionId ? escapeHtml(d.inscriptionId) : ''}</p>
            <div class="flex flex-wrap items-center gap-3 mt-3 justify-center sm:justify-start">
              <span class="px-2 py-0.5 rounded text-xs font-semibold ${d.isListed ? 'bg-green-900/40 text-green-400 border border-green-800' : 'bg-gray-800 text-gray-400 border border-gray-700'}">
                ${d.isListed ? 'Listed' : 'Not Listed'}
              </span>
              <span class="px-2 py-0.5 rounded text-xs font-semibold bg-purple-900/30 text-purple-300 border border-purple-800">
                Rarity #${fmt(d.rarityRank)} &middot; ${escapeHtml(d.rarityLabel || '')}
              </span>
            </div>
          </div>
        </div>

        <!-- Price section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 p-6 border-b border-doge-border">
          <div class="text-center p-4 bg-doge-dark rounded-xl border border-doge-border">
            <div class="text-xs text-doge-muted uppercase tracking-wider mb-1">Estimated Value</div>
            <div class="text-2xl font-bold text-doge-gold">${fmtDoge(est.estimatedDoge)}</div>
            ${est.estimatedUsd ? `<div class="text-sm text-gray-400 mt-1">${fmtUsd(est.estimatedUsd)}</div>` : ''}
          </div>
          <div class="text-center p-4 bg-doge-dark rounded-xl border border-doge-border">
            <div class="text-xs text-doge-muted uppercase tracking-wider mb-1">Collection Floor</div>
            <div class="text-2xl font-bold text-white">${fmtDoge(est.collectionFloor)}</div>
            ${est.dogeUsd && est.collectionFloor ? `<div class="text-sm text-gray-400 mt-1">${fmtUsd(est.collectionFloor * est.dogeUsd)}</div>` : ''}
          </div>
        </div>

        ${la ? `
        <!-- Listing analysis -->
        <div class="p-6 border-b border-doge-border">
          <h3 class="text-sm font-semibold text-doge-muted uppercase tracking-wider mb-3">Listing Analysis</h3>
          <div class="flex flex-wrap items-center gap-6 text-sm">
            <div>
              <span class="text-gray-400">Asking:</span>
              <span class="text-white font-semibold ml-1">${fmtDoge(la.askingPriceDoge)}</span>
            </div>
            <div>
              <span class="text-gray-400">vs Estimate:</span>
              <span class="${verdictColor(la.verdict)} font-semibold ml-1">${la.diffPercent > 0 ? '+' : ''}${la.diffPercent}%</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="${verdictColor(la.verdict)} font-bold text-base">${verdictIcon(la.verdict)}</span>
              <span class="${verdictColor(la.verdict)} font-semibold capitalize">${escapeHtml(la.verdict)}</span>
            </div>
          </div>
        </div>` : ''}

        <!-- Trait breakdown -->
        <div class="p-6">
          <h3 class="text-sm font-semibold text-doge-muted uppercase tracking-wider mb-3">Trait Breakdown</h3>
          <div class="grid gap-2">${traitHtml}</div>
          <div class="flex flex-wrap gap-4 mt-4 text-xs text-doge-muted">
            <span>Max trait floor: ${fmtDoge(est.maxTraitFloor)}</span>
            <span>Avg trait floor: ${fmtDoge(est.avgTraitFloor)}</span>
            <span>Rarity multiplier: ${d.rarityMultiplier ? d.rarityMultiplier + 'x' : '—'}</span>
          </div>
        </div>

        <!-- Timestamp -->
        <div class="px-6 pb-4 text-right text-[11px] text-gray-600">
          Evaluated ${new Date(d.evaluatedAt).toLocaleString()}
        </div>
      </div>`;
    }

    /* ---------- fetch ---------- */

    async function getInscriptionPrice(dogNumber) {
      const res = await fetch(`${API_BASE}/api/evaluate/${encodeURIComponent(dogNumber)}`);
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error(body?.error || `Server returned ${res.status}`);
      }
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      return data;
    }

    /* ---------- main handler ---------- */

    async function evaluate() {
      const num = sanitizeNumber(input.value);
      if (!num || num < 1 || num > 10000) {
        showError('Please enter a valid dog number between 1 and 10,000.');
        return;
      }

      showLoading();

      try {
        const data = await getInscriptionPrice(num);
        renderResult(data);
      } catch (err) {
        showError(err.message || 'Something went wrong. Please try again.');
      }
    }

    form.addEventListener('submit', e => { e.preventDefault(); evaluate(); });

    // Focus input on load
    input.focus();
  </script>
</body>
</html>
