  <script>
  // Load gallery images and videos from the /gallery/ folder via directory listing
  (function(){
    var grid = document.getElementById('galleryGrid');
    var media = document.getElementById('galleryMedia');
    var imgExts = /\.(jpe?g|png|gif|webp|svg|avif)$/i;
    var vidExts = /\.(mp4|webm|mov|ogv)$/i;
    var mediaExts = /\.(jpe?g|png|gif|webp|svg|avif|mp4|webm|mov|ogv)$/i;

    fetch('gallery/')
      .then(function(r){ return r.text(); })
      .then(function(html){
        // Python http.server returns an HTML directory listing — extract href values
        var matches = html.match(/href="([^"]+)"/g) || [];
        var files = [];
        matches.forEach(function(m){
          var name = m.replace('href="','').replace('"','');
          try { name = decodeURIComponent(name); } catch(e){}
          // Strip any leading path so we get just the filename
          name = name.replace(/^.*\//, '');
          if (mediaExts.test(name)) files.push(name);
        });

        if (!files.length) {
          if (media) media.hidden = true;
          return;
        }

        files.sort(function(a,b){ return a.localeCompare(b); });
        files.forEach(function(f){
          var item = document.createElement('div');
          item.className = 'gallery-item';

          if (vidExts.test(f)) {
            var vid = document.createElement('video');
            vid.src = 'gallery/' + f;
            vid.controls = true;
            vid.preload = 'metadata';
            vid.muted = true;
            vid.playsInline = true;
            item.appendChild(vid);
          } else {
            var img = document.createElement('img');
            img.src = 'gallery/' + f;
            img.alt = f.replace(imgExts,'').replace(/[-_]/g,' ');
            img.loading = 'lazy';
            item.appendChild(img);
          }

          grid.appendChild(item);
        });
      })
      .catch(function(){
        if (media) media.hidden = true;
      });
  })();
  </script>
